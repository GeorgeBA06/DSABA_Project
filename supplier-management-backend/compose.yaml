services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier_management
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier -d supplier_management"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - supplier_data_v2:/var/lib/postgresql/data
volumes:
  supplier_data_v2: {}
